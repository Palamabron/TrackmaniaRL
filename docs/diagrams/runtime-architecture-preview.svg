<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1000" viewBox="0 0 1000 1000">
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".14"/></filter></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="37" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#087d74"><tspan x="40" dy="0">TRACKMANIARL / SYSTEM GUIDE / 01</tspan></text>
<path d="M40,52 H960" stroke="#dce3ea" stroke-width="1"/>
<text font-weight="600" x="40" y="91" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#152b43"><tspan x="40" dy="0">How off-policy training runs</tspan></text>
<text x="40" y="131" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="40" dy="0">Actors collect experience. Durable ingestion feeds a learner that publishes the next policy.</tspan></text>
<rect x="40" y="314" width="296" height="260" rx="10" fill="#f3f5f7" stroke="none"/>
<text font-weight="600" x="64" y="352" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="64" dy="0">01 Collect</tspan></text>
<rect x="352" y="314" width="296" height="260" rx="10" fill="#f3f5f7" stroke="none"/>
<text font-weight="600" x="376" y="352" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="376" dy="0">02 Persist</tspan></text>
<rect x="664" y="314" width="296" height="260" rx="10" fill="#f3f5f7" stroke="none"/>
<text font-weight="600" x="688" y="352" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="688" dy="0">03 Learn</tspan></text>
<g data-edge="e-actor-wal">
<polyline points="312,456.0 376,456.0" fill="none" stroke="#285cc4" stroke-width="1.75" marker-end="url(#arrow)"/>
</g>
<g data-edge="e-wal-learner">
<polyline points="624,456.0 688,456.0" fill="none" stroke="#9b681f" stroke-width="1.75" marker-end="url(#arrow)"/>
</g>
<g data-edge="e-learner-snapshot">
<polyline points="812.0,528 812.0,638" fill="none" stroke="#087d74" stroke-width="1.75" marker-end="url(#arrow)"/>
</g>
<g data-edge="e-learner-evidence">
<polyline points="688,480 648,480 648,702 624,702" fill="none" stroke="#536579" stroke-width="1.75" marker-end="url(#arrow)"/>
</g>
<g data-edge="e-snapshot-actor">
<polyline points="812,742 812,806 188,806 188,528" fill="none" stroke="#087d74" stroke-width="1.75" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<rect x="347.0" y="780" width="186" height="51.0" rx="5" fill="#ffffff" fill-opacity=".92"/>
<text x="440.0" y="799" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#087d74"><tspan x="440.0" dy="0">activate next</tspan><tspan x="440.0" dy="22.5">episode</tspan></text>
</g>
<g data-node="actor">
<rect x="64" y="384" width="248" height="144" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M84,385 h32" stroke="#285cc4" stroke-width="3"/>
<text font-weight="600" x="84.0" y="437.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="84.0" dy="0">Actor + game adapter</tspan></text>
<text x="84.0" y="468.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="84.0" dy="0">Episode policy</tspan><tspan x="84.0" dy="22.5">Features + rollouts</tspan></text>
</g>
<g data-node="wal">
<rect x="376" y="384" width="248" height="144" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M396,385 h32" stroke="#9b681f" stroke-width="3"/>
<text font-weight="600" x="396.0" y="437.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="396.0" dy="0">Authenticated ingest</tspan></text>
<text x="396.0" y="468.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="396.0" dy="0">Commit before ACK</tspan><tspan x="396.0" dy="22.5">SQLite WAL</tspan></text>
</g>
<g data-node="learner">
<rect x="688" y="384" width="248" height="144" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M708,385 h32" stroke="#087d74" stroke-width="3"/>
<text font-weight="600" x="708.0" y="437.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="708.0" dy="0">Replay + learner</tspan></text>
<text x="708.0" y="468.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="708.0" dy="0">Sample + update</tspan><tspan x="708.0" dy="22.5">Advance WAL frontier</tspan></text>
</g>
<g data-node="snapshot">
<rect x="688" y="638" width="248" height="104" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M708,639 h32" stroke="#087d74" stroke-width="3"/>
<text font-weight="600" x="708.0" y="682.25" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="708.0" dy="0">Policy snapshot</tspan></text>
<text x="708.0" y="713.25" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="708.0" dy="0">Portable model tensors</tspan></text>
</g>
<g data-node="evidence">
<rect x="376" y="638" width="248" height="144" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M396,639 h32" stroke="#536579" stroke-width="3"/>
<text font-weight="600" x="396.0" y="691.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="396.0" dy="0">Checkpoint + logs</tspan></text>
<text x="396.0" y="722.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="396.0" dy="0">Replay + optimizer</tspan><tspan x="396.0" dy="22.5">RNG + WAL frontier</tspan></text>
</g>
<g data-note="resolve">
<rect x="40" y="174" width="920" height="104" rx="8" fill="#eff4fc" stroke="none" stroke-width="1.5"/>
<text x="60" y="208" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1f2937"><tspan font-weight="600" x="60" dy="0">BEFORE COLLECTION</tspan><tspan x="60" dy="22.5">RunSpec 2.0 resolves components, seeds and contracts into an immutable run manifest.</tspan></text>
</g>
<g data-note="durability">
<rect x="40" y="850" width="448" height="122" rx="8" fill="#fbf5e9" stroke="none" stroke-width="1.5"/>
<text x="60" y="884" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1f2937"><tspan font-weight="600" x="60" dy="0">DURABILITY</tspan><tspan x="60" dy="22.5">The actor spools unaccepted rollouts for retry.</tspan><tspan x="60" dy="22.5">WAL pruning waits until a durable checkpoint</tspan><tspan x="60" dy="22.5">covers the applied frontier.</tspan></text>
</g>
<g data-note="scope">
<rect x="512" y="850" width="448" height="120" rx="8" fill="#f3f5f7" stroke="none" stroke-width="1.5"/>
<text x="532" y="884" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1f2937"><tspan font-weight="600" x="532" dy="0">SCOPE</tspan><tspan x="532" dy="22.5">This is the off-policy path. PPO uses a separate</tspan><tspan x="532" dy="22.5">local, on-policy lifecycle.</tspan></text>
</g>
</svg>
