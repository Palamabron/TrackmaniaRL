<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080">
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".14"/></filter></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="37" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#087d74"><tspan x="40" dy="0">TRACKMANIARL / SYSTEM GUIDE / 08</tspan></text>
<path d="M40,52 H960" stroke="#dce3ea" stroke-width="1"/>
<text font-weight="600" x="40" y="91" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#152b43"><tspan x="40" dy="0">Choose a local or remote actor</tspan></text>
<text x="40" y="131" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="40" dy="0">Both deployments use the same authenticated actor-learner protocol and durability guarantees.</tspan></text>
<rect x="40" y="184" width="448" height="440" rx="10" fill="#f3f5f7" stroke="none"/>
<text font-weight="600" x="64" y="222" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="64" dy="0">01 Local deployment</tspan></text>
<rect x="512" y="184" width="448" height="440" rx="10" fill="#f3f5f7" stroke="none"/>
<text font-weight="600" x="536" y="222" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="536" dy="0">02 Remote deployment</tspan></text>
<g data-edge="e-host-local-transport">
<polyline points="264.0,386 264.0,454" fill="none" stroke="#536579" stroke-width="1.75" marker-end="url(#arrow)"/>
</g>
<g data-edge="e-remote-actor-tunnel">
<polyline points="736.0,386 736.0,454" fill="none" stroke="#9b681f" stroke-width="1.75" marker-end="url(#arrow)"/>
</g>
<g data-edge="e-local-transport-shared">
<polyline points="264,586 264,682 500,682 500,740" fill="none" stroke="#285cc4" stroke-width="1.75" marker-end="url(#arrow)"/>
</g>
<g data-edge="e-tunnel-shared">
<polyline points="736,586 736,682 500,682 500,740" fill="none" stroke="#9b681f" stroke-width="1.75" marker-end="url(#arrow)"/>
</g>
<g data-node="host">
<rect x="64" y="254" width="400" height="132" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M84,255 h32" stroke="#285cc4" stroke-width="3"/>
<text font-weight="600" x="84.0" y="301.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="84.0" dy="0">One Windows host</tspan></text>
<text x="84.0" y="332.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="84.0" dy="0">Launcher starts separate actor and</tspan><tspan x="84.0" dy="22.5">learner processes using spawn.</tspan></text>
</g>
<g data-node="local-transport">
<rect x="64" y="454" width="400" height="132" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M84,455 h32" stroke="#536579" stroke-width="3"/>
<text font-weight="600" x="84.0" y="501.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="84.0" dy="0">Local gRPC</tspan></text>
<text x="84.0" y="532.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="84.0" dy="0">The actor connects over loopback.</tspan><tspan x="84.0" dy="22.5">Rollouts still pass authentication.</tspan></text>
</g>
<g data-node="remote-actor">
<rect x="536" y="254" width="400" height="132" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M556,255 h32" stroke="#285cc4" stroke-width="3"/>
<text font-weight="600" x="556.0" y="301.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="556.0" dy="0">Separate game host</tspan></text>
<text x="556.0" y="332.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="556.0" dy="0">The remote actor drives Trackmania and</tspan><tspan x="556.0" dy="22.5">retains a durable rollout spool.</tspan></text>
</g>
<g data-node="tunnel">
<rect x="536" y="454" width="400" height="132" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M556,455 h32" stroke="#9b681f" stroke-width="3"/>
<text font-weight="600" x="556.0" y="501.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="556.0" dy="0">SSH or VPN tunnel</tspan></text>
<text x="556.0" y="532.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="556.0" dy="0">Authenticated encryption forwards the</tspan><tspan x="556.0" dy="22.5">learner loopback endpoint.</tspan></text>
</g>
<g data-node="shared">
<rect x="64" y="740" width="872" height="132" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M84,741 h32" stroke="#087d74" stroke-width="3"/>
<text font-weight="600" x="84.0" y="787.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="84.0" dy="0">Shared learner runtime</tspan></text>
<text x="84.0" y="818.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="84.0" dy="0">Authenticate identity → commit WAL → apply replay → update learner → publish policy /</tspan><tspan x="84.0" dy="22.5">checkpoint</tspan></text>
</g>
<g data-note="identity">
<rect x="40" y="924" width="448" height="124" rx="8" fill="#eff4fc" stroke="none" stroke-width="1.5"/>
<text x="60" y="958" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1f2937"><tspan font-weight="600" x="60" dy="0">IDENTITY</tspan><tspan x="60" dy="22.5">Both sides must agree on the run fingerprint,</tspan><tspan x="60" dy="22.5">map and contracts. The bearer token authorizes</tspan><tspan x="60" dy="22.5">requests.</tspan></text>
</g>
<g data-note="transport">
<rect x="512" y="924" width="448" height="124" rx="8" fill="#fbf5e9" stroke="none" stroke-width="1.5"/>
<text x="532" y="958" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1f2937"><tspan font-weight="600" x="532" dy="0">ENCRYPTION</tspan><tspan x="532" dy="22.5">The bearer token does not encrypt traffic. Keep</tspan><tspan x="532" dy="22.5">learner gRPC on loopback and tunnel remote</tspan><tspan x="532" dy="22.5">access.</tspan></text>
</g>
</svg>
