<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060">
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".14"/></filter></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="37" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#087d74"><tspan x="40" dy="0">TRACKMANIARL / SYSTEM GUIDE / 03</tspan></text>
<path d="M40,52 H960" stroke="#dce3ea" stroke-width="1"/>
<text font-weight="600" x="40" y="91" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#152b43"><tspan x="40" dy="0">From demonstrations to a driving policy</tspan></text>
<text x="40" y="131" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="40" dy="0">Prepare trustworthy data, fit offline, then require closed-loop evidence before an RL warm-start.</tspan></text>
<rect x="40" y="184" width="296" height="446" rx="10" fill="#f3f5f7" stroke="none"/>
<text font-weight="600" x="64" y="222" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="64" dy="0">01 Prepare data</tspan></text>
<rect x="352" y="184" width="296" height="446" rx="10" fill="#f3f5f7" stroke="none"/>
<text font-weight="600" x="376" y="222" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="376" dy="0">02 Fit offline</tspan></text>
<rect x="664" y="184" width="296" height="446" rx="10" fill="#f3f5f7" stroke="none"/>
<text font-weight="600" x="688" y="222" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="688" dy="0">03 Prove in game</tspan></text>
<g data-edge="e-dataset-split">
<polyline points="188.0,398 188.0,454" fill="none" stroke="#536579" stroke-width="1.75" marker-end="url(#arrow)"/>
</g>
<g data-edge="e-model-checkpoint">
<polyline points="500.0,398 500.0,454" fill="none" stroke="#087d74" stroke-width="1.75" marker-end="url(#arrow)"/>
</g>
<g data-edge="e-benchmark-promote">
<polyline points="812.0,398 812.0,474" fill="none" stroke="#9b681f" stroke-width="1.75" marker-end="url(#arrow)"/>
</g>
<g data-edge="e-split-model">
<polyline points="312,526 332,526 332,326 376,326" fill="none" stroke="#285cc4" stroke-width="1.75" marker-end="url(#arrow)"/>
</g>
<g data-edge="e-checkpoint-benchmark">
<polyline points="624,526 644,526 644,326 688,326" fill="none" stroke="#087d74" stroke-width="1.75" marker-end="url(#arrow)"/>
</g>
<g data-edge="e-promote-warmstart">
<polyline points="812,578 812,710" fill="none" stroke="#087d74" stroke-width="1.75" marker-end="url(#arrow)"/>
<rect x="836.85152" y="642" width="50.296960000000006" height="28.5" rx="5" fill="#ffffff" fill-opacity=".92"/>
<text x="862.0" y="661" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#087d74"><tspan x="862.0" dy="0">pass</tspan></text>
</g>
<g data-node="dataset">
<rect x="64" y="254" width="248" height="144" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M84,255 h32" stroke="#285cc4" stroke-width="3"/>
<text font-weight="600" x="84.0" y="307.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="84.0" dy="0">Record + validate</tspan></text>
<text x="84.0" y="338.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="84.0" dy="0">Complete laps + timing</tspan><tspan x="84.0" dy="22.5">Dataset provenance</tspan></text>
</g>
<g data-node="split">
<rect x="64" y="454" width="248" height="144" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M84,455 h32" stroke="#285cc4" stroke-width="3"/>
<text font-weight="600" x="84.0" y="507.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="84.0" dy="0">Split by lap</tspan></text>
<text x="84.0" y="538.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="84.0" dy="0">Train / validation</tspan><tspan x="84.0" dy="22.5">Then augment training</tspan></text>
</g>
<g data-node="model">
<rect x="376" y="254" width="248" height="144" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M396,255 h32" stroke="#087d74" stroke-width="3"/>
<text font-weight="600" x="396.0" y="307.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="396.0" dy="0">Behavior cloning</tspan></text>
<text x="396.0" y="338.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="396.0" dy="0">Encoder + temporal</tspan><tspan x="396.0" dy="22.5">Categorical action head</tspan></text>
</g>
<g data-node="checkpoint">
<rect x="376" y="454" width="248" height="144" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M396,455 h32" stroke="#087d74" stroke-width="3"/>
<text font-weight="600" x="396.0" y="507.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="396.0" dy="0">BC checkpoint</tspan></text>
<text x="396.0" y="538.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="396.0" dy="0">Held-out selection</tspan><tspan x="396.0" dy="22.5">Full trainer state</tspan></text>
</g>
<g data-node="benchmark">
<rect x="688" y="254" width="248" height="144" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M708,255 h32" stroke="#9b681f" stroke-width="3"/>
<text font-weight="600" x="708.0" y="294.5" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="708.0" dy="0">Closed-loop</tspan><tspan x="708.0" dy="25.0">benchmark</tspan></text>
<text x="708.0" y="350.5" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="708.0" dy="0">Measure finish rate,</tspan><tspan x="708.0" dy="22.5">pace and interventions.</tspan></text>
</g>
<g data-node="promote">
<polygon points="812.0,474 936,526.0 812.0,578 688,526.0" fill="#fbf5e9" stroke="#9b681f" stroke-width="1.5"/>

<text font-weight="600" x="812.0" y="533.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="812.0" dy="0">Promotion gate</tspan></text>
</g>
<g data-node="warmstart">
<rect x="688" y="710" width="248" height="152" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M708,711 h32" stroke="#087d74" stroke-width="3"/>
<text font-weight="600" x="708.0" y="767.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="708.0" dy="0">Warm-start RL</tspan></text>
<text x="708.0" y="798.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="708.0" dy="0">Encoder + temporal</tspan><tspan x="708.0" dy="22.5">New value head</tspan></text>
</g>
<g data-note="recovery">
<rect x="40" y="710" width="584" height="152" rx="8" fill="#fbf5e9" stroke="none" stroke-width="1.5"/>
<text x="60" y="744" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1f2937"><tspan font-weight="600" x="60" dy="0">IF THE POLICY FAILS</tspan><tspan x="60" dy="22.5">Collect DAgger recovery labels at student states, then repeat</tspan><tspan x="60" dy="22.5">preparation and offline training. Promotion criteria must be</tspan><tspan x="60" dy="22.5">explicit.</tspan></text>
</g>
<g data-note="resume">
<rect x="40" y="910" width="448" height="122" rx="8" fill="#f3f5f7" stroke="none" stroke-width="1.5"/>
<text x="60" y="944" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1f2937"><tspan font-weight="600" x="60" dy="0">EXACT BC RESUME</tspan><tspan x="60" dy="22.5">Restore trainer state, RNG and the same</tspan><tspan x="60" dy="22.5">dataset split. Offline demonstrations bypass RL</tspan><tspan x="60" dy="22.5">replay and actor WAL.</tspan></text>
</g>
<g data-note="transfer">
<rect x="512" y="910" width="448" height="122" rx="8" fill="#eff4fc" stroke="none" stroke-width="1.5"/>
<text x="532" y="944" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1f2937"><tspan font-weight="600" x="532" dy="0">TRANSFER BOUNDARY</tspan><tspan x="532" dy="22.5">A warm-start does not transfer the categorical</tspan><tspan x="532" dy="22.5">action head, optimizer state or episodic hidden</tspan><tspan x="532" dy="22.5">state.</tspan></text>
</g>
</svg>
