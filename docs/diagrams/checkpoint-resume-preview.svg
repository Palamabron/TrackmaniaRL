<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860">
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".14"/></filter></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="37" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#087d74"><tspan x="40" dy="0">TRACKMANIARL / SYSTEM GUIDE / 02</tspan></text>
<path d="M40,52 H960" stroke="#dce3ea" stroke-width="1"/>
<text font-weight="600" x="40" y="91" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#152b43"><tspan x="40" dy="0">Resume the complete training state</tspan></text>
<text x="40" y="131" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="40" dy="0">An exact resume restores one continuous run history, including unapplied durable experience.</tspan></text>
<rect x="40" y="184" width="296" height="446" rx="10" fill="#f3f5f7" stroke="none"/>
<text font-weight="600" x="64" y="222" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="64" dy="0">01 Capture</tspan></text>
<rect x="352" y="184" width="296" height="446" rx="10" fill="#f3f5f7" stroke="none"/>
<text font-weight="600" x="376" y="222" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="376" dy="0">02 Save durably</tspan></text>
<rect x="664" y="184" width="296" height="446" rx="10" fill="#f3f5f7" stroke="none"/>
<text font-weight="600" x="688" y="222" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="688" dy="0">03 Recover</tspan></text>
<g data-edge="e-running-capture">
<polyline points="188.0,398 188.0,454" fill="none" stroke="#536579" stroke-width="1.75" marker-end="url(#arrow)"/>
</g>
<g data-edge="e-write-checkpoint">
<polyline points="500.0,398 500.0,454" fill="none" stroke="#9b681f" stroke-width="1.75" marker-end="url(#arrow)"/>
</g>
<g data-edge="e-validate-restore">
<polyline points="812.0,398 812.0,454" fill="none" stroke="#087d74" stroke-width="1.75" marker-end="url(#arrow)"/>
</g>
<g data-edge="e-capture-write">
<polyline points="312,526 332,526 332,326 376,326" fill="none" stroke="#9b681f" stroke-width="1.75" marker-end="url(#arrow)"/>
</g>
<g data-edge="e-checkpoint-validate">
<polyline points="624,526 644,526 644,326 688,326" fill="none" stroke="#285cc4" stroke-width="1.75" marker-end="url(#arrow)"/>
</g>
<g data-node="running">
<rect x="64" y="254" width="248" height="144" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M84,255 h32" stroke="#285cc4" stroke-width="3"/>
<text font-weight="600" x="84.0" y="307.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="84.0" dy="0">Running learner</tspan></text>
<text x="84.0" y="338.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="84.0" dy="0">Replay + optimizer</tspan><tspan x="84.0" dy="22.5">RNG + counters</tspan></text>
</g>
<g data-node="capture">
<rect x="64" y="454" width="248" height="144" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M84,455 h32" stroke="#9b681f" stroke-width="3"/>
<text font-weight="600" x="84.0" y="507.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="84.0" dy="0">Coherent capture</tspan></text>
<text x="84.0" y="538.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="84.0" dy="0">State + applied WAL</tspan><tspan x="84.0" dy="22.5">frontier</tspan></text>
</g>
<g data-node="write">
<rect x="376" y="254" width="248" height="144" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M396,255 h32" stroke="#9b681f" stroke-width="3"/>
<text font-weight="600" x="396.0" y="307.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="396.0" dy="0">Durable write</tspan></text>
<text x="396.0" y="338.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="396.0" dy="0">Write a temporary file,</tspan><tspan x="396.0" dy="22.5">fsync, then replace.</tspan></text>
</g>
<g data-node="checkpoint">
<rect x="376" y="454" width="248" height="144" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M396,455 h32" stroke="#9b681f" stroke-width="3"/>
<text font-weight="600" x="396.0" y="507.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="396.0" dy="0">Checkpoint 2.0</tspan></text>
<text x="396.0" y="538.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="396.0" dy="0">State, identity and</tspan><tspan x="396.0" dy="22.5">WAL frontier</tspan></text>
</g>
<g data-node="validate">
<rect x="688" y="254" width="248" height="144" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M708,255 h32" stroke="#285cc4" stroke-width="3"/>
<text font-weight="600" x="708.0" y="307.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="708.0" dy="0">Validate recovery</tspan></text>
<text x="708.0" y="338.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="708.0" dy="0">Schema + run identity</tspan><tspan x="708.0" dy="22.5">Journal + prune floor</tspan></text>
</g>
<g data-node="restore">
<rect x="688" y="454" width="248" height="144" rx="8" fill="#ffffff" stroke="#cdd7e2" stroke-width="1.5"/>
<path d="M708,455 h32" stroke="#087d74" stroke-width="3"/>
<text font-weight="600" x="708.0" y="507.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#152b43"><tspan x="708.0" dy="0">Restore + replay WAL</tspan></text>
<text x="708.0" y="538.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="708.0" dy="0">Restore state</tspan><tspan x="708.0" dy="22.5">Replay WAL by row ID</tspan></text>
</g>
<g data-note="fail-closed">
<rect x="40" y="676" width="448" height="148" rx="8" fill="#fbf5e9" stroke="none" stroke-width="1.5"/>
<text x="60" y="710" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1f2937"><tspan font-weight="600" x="60" dy="0">RECOVERY GATE</tspan><tspan x="60" dy="22.5">A foreign journal or an invalid frontier is</tspan><tspan x="60" dy="22.5">rejected. Prune WAL only after the checkpoint is</tspan><tspan x="60" dy="22.5">durable.</tspan></text>
</g>
<g data-note="warmstart">
<rect x="512" y="676" width="448" height="148" rx="8" fill="#eff4fc" stroke="none" stroke-width="1.5"/>
<text x="532" y="710" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1f2937"><tspan font-weight="600" x="532" dy="0">WARM-START IS DIFFERENT</tspan><tspan x="532" dy="22.5">Loading compatible model tensors starts a new</tspan><tspan x="532" dy="22.5">run. It does not restore replay, optimizer or</tspan><tspan x="532" dy="22.5">RNG.</tspan></text>
</g>
</svg>
