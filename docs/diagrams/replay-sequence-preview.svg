<text x="556.0" y="862.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="556.0" dy="0">Use priorities and optional mixtures.</tspan><tspan x="556.0" dy="22.5">Correct loss with normalized IS weights.</tspan></text>
