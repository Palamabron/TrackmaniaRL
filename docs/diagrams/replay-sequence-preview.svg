<text x="40" y="37" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#087d74"><tspan x="40" dy="0">TRACKMANIARL / SYSTEM GUIDE / 06</tspan></text>
<path d="M40,52 H960" stroke="#dce3ea" stroke-width="1"/>
<text font-weight="600" x="40" y="91" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#152b43"><tspan x="40" dy="0">Learn from a complete replay history</tspan></text>
<text x="40" y="131" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="40" dy="0">Episode-local windows preserve real context. Masks and n-step horizons determine valid learning.</tspan></text>
<rect x="40" y="184" width="920" height="238" rx="10" fill="#f3f5f7" stroke="none"/>
<text font-weight="600" x="64" y="222" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="64" dy="0">01 One contiguous history, t0 ... tL-1</tspan></text>
<rect x="40" y="466" width="920" height="240" rx="10" fill="#f3f5f7" stroke="none"/>
<text font-weight="600" x="64" y="504" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="64" dy="0">02 Construct targets and train</tspan></text>
