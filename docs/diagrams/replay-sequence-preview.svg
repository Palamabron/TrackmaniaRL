<g data-note="terminal">
<rect x="40" y="1004" width="448" height="108" rx="8" fill="#f3f5f7" stroke="none" stroke-width="1.5"/>
<text x="60" y="1038" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1f2937"><tspan font-weight="600" x="60" dy="0">BOOTSTRAP BOUNDARY</tspan><tspan x="60" dy="22.5">A true terminal uses zero bootstrap. Truncation</tspan><tspan x="60" dy="22.5">follows the transition discount contract.</tspan></text>
