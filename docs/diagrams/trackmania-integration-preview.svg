<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1166" viewBox="0 0 1000 1166">
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".14"/></filter></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="37" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#087d74"><tspan x="40" dy="0">TRACKMANIARL / SYSTEM GUIDE / 09</tspan></text>
<path d="M40,52 H960" stroke="#dce3ea" stroke-width="1"/>
<text font-weight="600" x="40" y="91" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#152b43"><tspan x="40" dy="0">Connect the game to the agent</tspan></text>
<text x="40" y="131" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="40" dy="0">Openplanet observes Trackmania. The adapter validates data. A separate local backend drives the car.</tspan></text>
<rect x="40" y="184" width="296" height="458" rx="10" fill="#f3f5f7" stroke="none"/>
<text font-weight="600" x="64" y="222" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="64" dy="0">01 Trackmania 2020</tspan></text>
<rect x="352" y="184" width="296" height="458" rx="10" fill="#f3f5f7" stroke="none"/>
<text font-weight="600" x="376" y="222" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="376" dy="0">02 Openplanet plugin</tspan></text>
<rect x="664" y="184" width="296" height="458" rx="10" fill="#f3f5f7" stroke="none"/>
<text font-weight="600" x="688" y="222" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="688" dy="0">03 Python adapter</tspan></text>
