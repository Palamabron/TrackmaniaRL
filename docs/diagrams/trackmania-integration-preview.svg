<text x="84.0" y="336.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="84.0" dy="0">School Mode + editor</tspan><tspan x="84.0" dy="22.5">Car at start</tspan></text>
