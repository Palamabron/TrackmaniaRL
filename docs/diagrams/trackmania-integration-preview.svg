<text x="84.0" y="546.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="84.0" dy="0">Race timer, position,</tspan><tspan x="84.0" dy="22.5">velocity and controls</tspan></text>
