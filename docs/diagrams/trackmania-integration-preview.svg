<text x="708.0" y="890.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="708.0" dy="0">Steering, throttle and</tspan><tspan x="708.0" dy="22.5">brake</tspan></text>
