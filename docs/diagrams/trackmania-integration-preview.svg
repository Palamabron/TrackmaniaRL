<g data-note="plugin">
<rect x="40" y="1016" width="448" height="122" rx="8" fill="#f3f5f7" stroke="none" stroke-width="1.5"/>
<text x="60" y="1050" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1f2937"><tspan font-weight="600" x="60" dy="0">PLUGIN BOUNDARY</tspan><tspan x="60" dy="22.5">TrackmaniaRL Connect / SAC_GetData</tspan><tspan x="60" dy="22.5">supplies telemetry and session data. It does not</tspan><tspan x="60" dy="22.5">send controls.</tspan></text>
</g>
<g data-note="geometry">
<rect x="512" y="1016" width="448" height="122" rx="8" fill="#eff4fc" stroke="none" stroke-width="1.5"/>
<text x="532" y="1050" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#1f2937"><tspan font-weight="600" x="532" dy="0">GEOMETRY BOUNDARY</tspan><tspan x="532" dy="22.5">Drivable boundaries come from a map-bound,</tspan><tspan x="532" dy="22.5">checksummed asset, not Openplanet</tspan><tspan x="532" dy="22.5">placement metadata.</tspan></text>
</g>
