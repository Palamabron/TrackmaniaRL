<text x="396.0" y="546.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="396.0" dy="0">33 little-endian float32</tspan><tspan x="396.0" dy="22.5">values per game tick</tspan></text>
