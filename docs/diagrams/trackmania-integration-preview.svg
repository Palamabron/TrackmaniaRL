<text x="708.0" y="546.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="708.0" dy="0">Lidar + reward</tspan><tspan x="708.0" dy="22.5">Policy + contract IDs</tspan></text>
</g>
