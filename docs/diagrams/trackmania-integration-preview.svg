<text x="396.0" y="336.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="396.0" dy="0">JSONL protocol 2</tspan><tspan x="396.0" dy="22.5">Map UID + readiness</tspan></text>
