<text x="84.0" y="890.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="84.0" dy="0">Select a validated</tspan><tspan x="84.0" dy="22.5">discrete control action.</tspan></text>
</g>
