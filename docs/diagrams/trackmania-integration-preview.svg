<text x="708.0" y="336.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#536579"><tspan x="708.0" dy="0">Schema + map identity</tspan><tspan x="708.0" dy="22.5">Readiness + hashes</tspan></text>
