<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1740" viewBox="0 0 1200 1740" role="img" aria-labelledby="title desc">
<title id="title">Inside the geometry-based controller</title>
<desc id="desc">Four ordered environmental tensors contain 264 road coordinates, 60 car features, 29 context features and 8 recovery indicators. Parallel road encoders merge by addition, as do car and context. Concatenation feeds four normalized SimbaV2 blocks. Gated recovery precedes the identity core. Thirty-two internal quantile levels enter dueling IQN. The map-specific reference filter selects controls after the network.</desc>
