<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180" role="img" aria-labelledby="title desc"><title id="title">V107I network and V108 controller</title><desc id="desc">Road graph and car-context branches feed four SimBa blocks. Incident-gated recovery is added before the identity temporal core and IQN head. The map-specific neighbors filter acts after action scoring. Conv1D's final correction was zero throughout the film.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#60796a"/></marker></defs><rect width="1400" height="1180" fill="#eef3ed"/><g font-family="Segoe UI,Arial,sans-serif" fill="#202c27"><text x="40" y="48" font-size="34" fill="#202c27" font-weight="650">V107I network + V108 action support</text><text x="40" y="83" font-size="21" fill="#52655a" font-weight="400">The evaluated geometry-based controller · 20 decisions per second</text><path d="M325 240V275H220V300" fill="none" stroke="#60796a" stroke-width="3" marker-end="url(#arrow)"/><path d="M325 275H565V300" fill="none" stroke="#60796a" stroke-width="3" marker-end="url(#arrow)"/><path d="M925 240V300" fill="none" stroke="#60796a" stroke-width="3" marker-end="url(#arrow)"/><path d="M1215 240V300" fill="none" stroke="#60796a" stroke-width="3" marker-end="url(#arrow)"/><path d="M925 440V490" fill="none" stroke="#60796a" stroke-width="3" marker-end="url(#arrow)"/><path d="M1215 440V490H1010" fill="none" stroke="#60796a" stroke-width="3" marker-end="url(#arrow)"/><path d="M220 465V500" fill="none" stroke="#60796a" stroke-width="3" marker-end="url(#arrow)"/><path d="M565 465V500" fill="none" stroke="#60796a" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 7"/><path d="M380 575V615H700V640" fill="none" stroke="#60796a" stroke-width="3" marker-end="url(#arrow)"/><path d="M1070 565V615H700" fill="none" stroke="#60796a" stroke-width="3" marker-end="url(#arrow)"/><path d="M700 765V815" fill="none" stroke="#60796a" stroke-width="3" marker-end="url(#arrow)"/><path d="M350 865H410" fill="none" stroke="#60796a" stroke-width="3" marker-end="url(#arrow)"/><path d="M740 865H810" fill="none" stroke="#60796a" stroke-width="3" marker-end="url(#arrow)"/><path d="M1070 945V990H890" fill="none" stroke="#60796a" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="120" width="570" height="120" rx="6" fill="#fbfcfa" stroke="#b8cabc" stroke-width="2"/><text x="62" y="156" font-size="25" fill="#202c27" font-weight="600">Road geometry · 44 × 6</text><text x="62" y="190" font-size="21" fill="#52655a" font-weight="400">Left / center / right coordinates</text><text x="62" y="219" font-size="21" fill="#52655a" font-weight="400">Road stations expressed relative to the car</text><rect x="750" y="120" width="280" height="120" rx="6" fill="#fbfcfa" stroke="#b8cabc" stroke-width="2"/><text x="772" y="156" font-size="25" fill="#202c27" font-weight="600">Car · 60</text><text x="772" y="190" font-size="21" fill="#52655a" font-weight="400">Motion, controls,</text><text x="772" y="219" font-size="21" fill="#52655a" font-weight="400">curvature preview</text><rect x="1060" y="120" width="300" height="120" rx="6" fill="#fbfcfa" stroke="#b8cabc" stroke-width="2"/><text x="1082" y="156" font-size="25" fill="#202c27" font-weight="600">Context · 29</text><text x="1082" y="190" font-size="21" fill="#52655a" font-weight="400">Position, clearance,</text><text x="1082" y="219" font-size="21" fill="#52655a" font-weight="400">slip and lookahead</text><rect x="40" y="300" width="360" height="165" rx="6" fill="#fbfcfa" stroke="#b8cabc" stroke-width="2"/><text x="62" y="336" font-size="25" fill="#202c27" font-weight="600">GNN</text><text x="62" y="370" font-size="21" fill="#52655a" font-weight="400">2 message-passing steps</text><text x="62" y="399" font-size="21" fill="#52655a" font-weight="400">128 features → pooling</text><text x="62" y="428" font-size="21" fill="#52655a" font-weight="400">Projection to 192</text><rect x="430" y="300" width="330" height="165" rx="6" fill="#fbfcfa" stroke="#b8cabc" stroke-width="2"/><text x="452" y="336" font-size="25" fill="#202c27" font-weight="600">Conv1D residual</text><text x="452" y="370" font-size="21" fill="#52655a" font-weight="400">4 dilated blocks · 64 wide</text><text x="452" y="399" font-size="21" fill="#52655a" font-weight="400">Bounded correction</text><text x="452" y="428" font-size="21" fill="#52655a" font-weight="400">Zero output in this film</text><rect x="800" y="300" width="240" height="140" rx="6" fill="#fbfcfa" stroke="#b8cabc" stroke-width="2"/><text x="822" y="336" font-size="25" fill="#202c27" font-weight="600">Car MLP</text><text x="822" y="370" font-size="21" fill="#52655a" font-weight="400">60 → 192</text><text x="822" y="399" font-size="21" fill="#52655a" font-weight="400">Norm + SiLU</text><rect x="1070" y="300" width="290" height="140" rx="6" fill="#fbfcfa" stroke="#b8cabc" stroke-width="2"/><text x="1092" y="336" font-size="25" fill="#202c27" font-weight="600">Context adapter</text><text x="1092" y="370" font-size="21" fill="#52655a" font-weight="400">29 → 192 → 192</text><text x="1092" y="399" font-size="21" fill="#52655a" font-weight="400">+ 0.02 × tanh</text><rect x="40" y="500" width="720" height="75" rx="6" fill="#fbfcfa" stroke="#b8cabc" stroke-width="2"/><text x="62" y="536" font-size="25" fill="#202c27" font-weight="600">Road representation · 192</text><rect x="800" y="490" width="560" height="75" rx="6" fill="#fbfcfa" stroke="#b8cabc" stroke-width="2"/><text x="822" y="526" font-size="25" fill="#202c27" font-weight="600">Motion + context · 192</text><rect x="410" y="640" width="950" height="125" rx="6" fill="#225541" stroke="#225541" stroke-width="2"/><text x="432" y="676" font-size="25" fill="#fff" font-weight="600">SimBa backbone</text><text x="432" y="710" font-size="21" fill="#deeadf" font-weight="400">Concat 384 + constant → 192; unit normalization</text><text x="432" y="739" font-size="21" fill="#deeadf" font-weight="400">4 blocks: 192 → 768 → 192; learned residual interpolation</text><rect x="40" y="795" width="310" height="150" rx="6" fill="#fbfcfa" stroke="#b8cabc" stroke-width="2"/><text x="62" y="831" font-size="25" fill="#202c27" font-weight="600">Recovery · 8 → 192</text><text x="62" y="865" font-size="21" fill="#52655a" font-weight="400">Incident + speed-loss gate</text><text x="62" y="894" font-size="21" fill="#52655a" font-weight="400">Bounded correction</text><text x="62" y="923" font-size="21" fill="#52655a" font-weight="400">0.01 × tanh</text><rect x="410" y="815" width="330" height="100" rx="6" fill="#fbfcfa" stroke="#b8cabc" stroke-width="2"/><text x="432" y="851" font-size="25" fill="#202c27" font-weight="600">Add recovery</text><text x="432" y="885" font-size="21" fill="#52655a" font-weight="400">Identity core · no GRU</text><rect x="810" y="795" width="550" height="150" rx="6" fill="#225541" stroke="#225541" stroke-width="2"/><text x="832" y="831" font-size="25" fill="#fff" font-weight="600">Dueling IQN</text><text x="832" y="865" font-size="21" fill="#deeadf" font-weight="400">Value and advantage streams</text><text x="832" y="894" font-size="21" fill="#deeadf" font-weight="400">32 evaluation quantiles</text><text x="832" y="923" font-size="21" fill="#deeadf" font-weight="400">78 expected action values</text><rect x="410" y="990" width="950" height="120" rx="6" fill="#fbfcfa" stroke="#b8cabc" stroke-width="2"/><text x="432" y="1026" font-size="25" fill="#202c27" font-weight="600">V108 neighbors filter → controls</text><text x="432" y="1060" font-size="21" fill="#52655a" font-weight="400">15 nearby reference states; restrict actions on 54–90% of route</text><text x="432" y="1089" font-size="21" fill="#52655a" font-weight="400">Fall back when slow or outside support; network weights unchanged</text><text x="40" y="1160" font-size="20" fill="#52655a" font-weight="400">Solid paths carry the main representation. Conv1D is present, but contributed a zero correction in all 733 recorded decisions.</text></g></svg>