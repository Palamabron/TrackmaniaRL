<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Geometry-based driving model</title><desc id="desc">Road geometry and car-context branches feed explicit additions and concatenation, then four SimBaV2 blocks. Gated recovery is added before an identity temporal core and dueling IQN. Thirty-two evaluation quantiles yield 78 action scores. Reference-supported action choice produces controls at 20 Hz. Conv1D was present but its final correction was zero throughout the recorded lap.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#557264"/></marker><marker id="muted-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b958e"/></marker></defs><rect width="1200" height="1600" fill="#eef3ed"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="52" font-size="34" fill="#202c27" text-anchor="start" font-weight="650">Geometry-based driving model</text><text x="40" y="87" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">The recorded controller, from road and motion to a driving command</text><g aria-label="Connections: arrows end only at target boundaries"><path d="M300 225V252M180 252H455" fill="none" stroke="#557264" stroke-width="2.6"/><circle cx="300" cy="252" r="4.5" fill="#557264"/><path d="M180 252V290" fill="none" stroke="#557264" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M455 252V290" fill="none" stroke="#557264" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M730 225V290" fill="none" stroke="#557264" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1025 225V290" fill="none" stroke="#557264" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M180 460V520" fill="none" stroke="#557264" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M730 460V520" fill="none" stroke="#557264" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1025 460V520" fill="none" stroke="#557264" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M300 595V625H500V655" fill="none" stroke="#557264" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M885 595V625H700V655" fill="none" stroke="#557264" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M600 730V775" fill="none" stroke="#557264" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M600 875V920" fill="none" stroke="#557264" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M600 1050V1090H400V1148" fill="none" stroke="#557264" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320 1170H378" fill="none" stroke="#557264" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M422 1170H480" fill="none" stroke="#557264" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M710 1170H780" fill="none" stroke="#557264" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M970 1250V1305" fill="none" stroke="#557264" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M970 1405V1455" fill="none" stroke="#557264" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M455 460V520" fill="none" stroke="#8b958e" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#muted-arrow)"/></g><rect x="40" y="125" width="520" height="100" rx="8" fill="#fbfcfa" stroke="#b9cbbd" stroke-width="1.6"/><text x="62" y="163" font-size="25" fill="#202c27" text-anchor="start" font-weight="600">Road geometry · 44 × 6</text><text x="62" y="198" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">Left, center and right positions relative to the car</text><rect x="610" y="125" width="240" height="100" rx="8" fill="#fbfcfa" stroke="#b9cbbd" stroke-width="1.6"/><text x="632" y="163" font-size="25" fill="#202c27" text-anchor="start" font-weight="600">Car · 60</text><text x="632" y="198" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">Motion and controls</text><rect x="890" y="125" width="270" height="100" rx="8" fill="#fbfcfa" stroke="#b9cbbd" stroke-width="1.6"/><text x="912" y="163" font-size="25" fill="#202c27" text-anchor="start" font-weight="600">Context · 29</text><text x="912" y="198" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">Position, slip, preview</text><rect x="40" y="290" width="280" height="170" rx="8" fill="#fbfcfa" stroke="#b9cbbd" stroke-width="1.6"/><text x="62" y="328" font-size="25" fill="#202c27" text-anchor="start" font-weight="600">Road GNN</text><text x="62" y="363" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">2 message-passing steps</text><text x="62" y="394" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">128 features per node</text><text x="62" y="425" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">Pool → project to 192</text><rect x="350" y="290" width="210" height="170" rx="8" fill="#fbfcfa" stroke="#b9cbbd" stroke-width="1.6"/><text x="372" y="328" font-size="25" fill="#202c27" text-anchor="start" font-weight="600">Conv1D</text><text x="372" y="363" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">4 dilated blocks</text><text x="372" y="394" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">Bounded correction</text><text x="371" y="431" font-size="19" fill="#52655a" text-anchor="start" font-weight="400">Zero in recorded lap</text><rect x="610" y="290" width="240" height="170" rx="8" fill="#fbfcfa" stroke="#b9cbbd" stroke-width="1.6"/><text x="632" y="328" font-size="25" fill="#202c27" text-anchor="start" font-weight="600">Car MLP</text><text x="632" y="363" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">60 → 192</text><text x="632" y="394" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">Motion representation</text><rect x="890" y="290" width="270" height="170" rx="8" fill="#fbfcfa" stroke="#b9cbbd" stroke-width="1.6"/><text x="912" y="328" font-size="25" fill="#202c27" text-anchor="start" font-weight="600">Context MLP</text><text x="912" y="363" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">29 → 192 → 192</text><text x="912" y="394" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">Bounded correction</text><text x="912" y="425" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">0.02 × tanh</text><rect x="40" y="520" width="520" height="75" rx="8" fill="#fbfcfa" stroke="#b9cbbd" stroke-width="1.6"/><circle cx="77" cy="557.5" r="19" fill="#e1ece4"/><text x="77" y="565" font-size="27" fill="#225541" text-anchor="middle" font-weight="400">+</text><text x="111" y="551" font-size="25" fill="#202c27" text-anchor="start" font-weight="600">ADD</text><text x="111" y="579" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">Road representation · 192</text><rect x="610" y="520" width="550" height="75" rx="8" fill="#fbfcfa" stroke="#b9cbbd" stroke-width="1.6"/><circle cx="647" cy="557.5" r="19" fill="#e1ece4"/><text x="647" y="565" font-size="27" fill="#225541" text-anchor="middle" font-weight="400">+</text><text x="681" y="551" font-size="25" fill="#202c27" text-anchor="start" font-weight="600">ADD</text><text x="681" y="579" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">Car + context representation · 192</text><rect x="400" y="655" width="400" height="75" rx="8" fill="#fbfcfa" stroke="#b9cbbd" stroke-width="1.6"/><text x="600" y="691" font-size="25" fill="#202c27" text-anchor="middle" font-weight="600">CONCATENATE</text><text x="600" y="724" font-size="21" fill="#52655a" text-anchor="middle" font-weight="400">192 + 192 = 384 features</text><rect x="350" y="775" width="500" height="100" rx="8" fill="#fbfcfa" stroke="#b9cbbd" stroke-width="1.6"/><text x="600" y="811" font-size="25" fill="#202c27" text-anchor="middle" font-weight="600">Add constant channel · 384 → 385</text><text x="600" y="844" font-size="21" fill="#52655a" text-anchor="middle" font-weight="400">Normalize → project to 192 → normalize</text><rect x="310" y="920" width="580" height="130" rx="8" fill="#225541" stroke="#225541" stroke-width="1.6"/><text x="600" y="956" font-size="25" fill="#fff" text-anchor="middle" font-weight="600">SimBaV2 · 4 residual blocks</text><text x="600" y="989" font-size="21" fill="#e1ece4" text-anchor="middle" font-weight="400">Each block: 192 → 768 → 192</text><text x="600" y="1021" font-size="21" fill="#e1ece4" text-anchor="middle" font-weight="400">Learned interpolation (LERP) + normalization</text><rect x="40" y="1090" width="280" height="160" rx="8" fill="#fbfcfa" stroke="#b9cbbd" stroke-width="1.6"/><text x="62" y="1128" font-size="25" fill="#202c27" text-anchor="start" font-weight="600">Recovery · 8 → 192</text><text x="62" y="1163" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">Incident + speed-loss gate</text><text x="62" y="1194" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">Bounded correction</text><text x="62" y="1225" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">0.01 × tanh</text><circle cx="400" cy="1170" r="22" fill="#fbfcfa" stroke="#557264" stroke-width="2"/><text x="400" y="1178" font-size="28" fill="#202c27" text-anchor="middle" font-weight="400">+</text><text x="400" y="1213" font-size="18" fill="#557264" text-anchor="middle" font-weight="600">ADD</text><rect x="480" y="1130" width="230" height="80" rx="8" fill="#fbfcfa" stroke="#b9cbbd" stroke-width="1.6"/><text x="595" y="1166" font-size="25" fill="#202c27" text-anchor="middle" font-weight="600">Identity core</text><text x="595" y="1199" font-size="21" fill="#52655a" text-anchor="middle" font-weight="400">No GRU · 192 features</text><rect x="780" y="1090" width="380" height="160" rx="8" fill="#225541" stroke="#225541" stroke-width="1.6"/><text x="802" y="1128" font-size="25" fill="#fff" text-anchor="start" font-weight="600">Dueling IQN</text><text x="802" y="1163" font-size="21" fill="#e1ece4" text-anchor="start" font-weight="400">Value + advantage streams</text><text x="802" y="1194" font-size="21" fill="#e1ece4" text-anchor="start" font-weight="400">32 evaluation quantiles</text><text x="802" y="1225" font-size="21" fill="#e1ece4" text-anchor="start" font-weight="400">→ 78 expected action values</text><rect x="740" y="1305" width="420" height="100" rx="8" fill="#fbfcfa" stroke="#b9cbbd" stroke-width="1.6"/><text x="762" y="1343" font-size="23" fill="#202c27" text-anchor="start" font-weight="600">Reference-supported action choice</text><text x="762" y="1378" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">Choose top score among allowed actions</text><rect x="740" y="1455" width="420" height="80" rx="8" fill="#225541" stroke="#225541" stroke-width="1.6"/><text x="950" y="1491" font-size="25" fill="#fff" text-anchor="middle" font-weight="600">Steering · throttle · brake</text><text x="950" y="1524" font-size="21" fill="#e1ece4" text-anchor="middle" font-weight="400">20 decisions per second</text><text x="40" y="1340" font-size="18" fill="#557264" text-anchor="start" font-weight="600">READING THE DIAGRAM</text><text x="40" y="1377" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">+ adds vectors of the same size.</text><text x="40" y="1410" font-size="21" fill="#52655a" text-anchor="start" font-weight="400">Concatenation joins them into one longer vector.</text><path d="M40 1456H100" stroke="#8b958e" stroke-width="2.6" stroke-dasharray="7 6"/><text x="115" y="1462" font-size="19" fill="#52655a" text-anchor="start" font-weight="400">Present branch, zero final correction in all</text><text x="115" y="1490" font-size="19" fill="#52655a" text-anchor="start" font-weight="400">733 decisions of the recorded lap.</text><text x="40" y="1540" font-size="19" fill="#52655a" text-anchor="start" font-weight="400">Action support is outside the network and specific to this map.</text><text x="40" y="1568" font-size="19" fill="#52655a" text-anchor="start" font-weight="400">It falls back to ordinary action choice outside its supported states.</text></g></svg>
