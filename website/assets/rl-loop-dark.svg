<svg fill="#e7eee9" xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">How the agent learns while it drives</title><desc id="desc">The live loop observes the car and road, chooses a policy action, sends controls to Trackmania and receives the next observation and reward. Each transition is stored in replay. A separate learner samples old transitions and updates the policy: an off-policy learning loop.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9eb8a9"/></marker><marker id="muted-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a4b4a9"/></marker></defs><rect width="1200" height="740" fill="#18221e"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="52" font-size="34" fill="#e7eee9" text-anchor="start" font-weight="650">How the agent learns while it drives</text><text x="40" y="87" font-size="21" fill="#adbbb2" text-anchor="start" font-weight="400">The driving loop runs repeatedly. Learning reuses the experience it leaves behind.</text><path d="M1075 210V157H162V210" fill="none" stroke="#9eb8a9" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="620" y="141" font-size="21" fill="#9eb8a9" text-anchor="middle" font-weight="400">Next observation + reward</text><path d="M285 272H355" fill="none" stroke="#9eb8a9" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M600 272H665" fill="none" stroke="#9eb8a9" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M880 272H950" fill="none" stroke="#9eb8a9" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1075 335V365H1035V390" fill="none" stroke="#9eb8a9" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1035 465V520" fill="none" stroke="#9eb8a9" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M825 580H720" fill="none" stroke="#9eb8a9" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M550 520V435H477V335" fill="none" stroke="#a4b4a9" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#muted-arrow)"/><text x="565" y="450" font-size="20" fill="#adbbb2" text-anchor="start" font-weight="400">Updated weights</text><text x="565" y="478" font-size="20" fill="#adbbb2" text-anchor="start" font-weight="400">from the learner</text><rect x="40" y="210" width="245" height="125" rx="8" fill="#202d26" stroke="#52655b" stroke-width="1.6"/><text x="62" y="248" font-size="25" fill="#e7eee9" text-anchor="start" font-weight="600">Observe</text><text x="62" y="283" font-size="21" fill="#adbbb2" text-anchor="start" font-weight="400">Car state</text><text x="62" y="314" font-size="21" fill="#adbbb2" text-anchor="start" font-weight="400">Road ahead</text><rect x="355" y="210" width="245" height="125" rx="8" fill="#225541" stroke="#225541" stroke-width="1.6"/><text x="377" y="248" font-size="25" fill="#fff" text-anchor="start" font-weight="600">Policy</text><text x="377" y="283" font-size="21" fill="#e1ece4" text-anchor="start" font-weight="400">Score actions</text><text x="377" y="314" font-size="21" fill="#e1ece4" text-anchor="start" font-weight="400">Choose a command</text><rect x="665" y="210" width="215" height="125" rx="8" fill="#202d26" stroke="#52655b" stroke-width="1.6"/><text x="687" y="248" font-size="25" fill="#e7eee9" text-anchor="start" font-weight="600">Controls</text><text x="687" y="283" font-size="21" fill="#adbbb2" text-anchor="start" font-weight="400">Steering</text><text x="687" y="314" font-size="21" fill="#adbbb2" text-anchor="start" font-weight="400">Throttle + brake</text><rect x="950" y="210" width="210" height="125" rx="8" fill="#202d26" stroke="#52655b" stroke-width="1.6"/><text x="972" y="248" font-size="25" fill="#e7eee9" text-anchor="start" font-weight="600">Trackmania</text><text x="972" y="283" font-size="21" fill="#adbbb2" text-anchor="start" font-weight="400">Apply action</text><text x="972" y="314" font-size="21" fill="#adbbb2" text-anchor="start" font-weight="400">Advance the game</text><rect x="910" y="390" width="250" height="75" rx="8" fill="#202d26" stroke="#52655b" stroke-width="1.6"/><text x="1035" y="426" font-size="25" fill="#e7eee9" text-anchor="middle" font-weight="600">Store transition</text><text x="1035" y="459" font-size="21" fill="#adbbb2" text-anchor="middle" font-weight="400">State, action, reward…</text><rect x="825" y="520" width="335" height="120" rx="8" fill="#202d26" stroke="#52655b" stroke-width="1.6"/><text x="847" y="558" font-size="25" fill="#e7eee9" text-anchor="start" font-weight="600">Replay buffer</text><text x="847" y="593" font-size="21" fill="#adbbb2" text-anchor="start" font-weight="400">Keep past transitions</text><text x="847" y="624" font-size="21" fill="#adbbb2" text-anchor="start" font-weight="400">Sample them more than once</text><rect x="380" y="520" width="340" height="120" rx="8" fill="#225541" stroke="#225541" stroke-width="1.6"/><text x="402" y="558" font-size="25" fill="#fff" text-anchor="start" font-weight="600">Learner</text><text x="402" y="593" font-size="21" fill="#e1ece4" text-anchor="start" font-weight="400">Compare prediction and target</text><text x="402" y="624" font-size="21" fill="#e1ece4" text-anchor="start" font-weight="400">Update the network</text><text x="772" y="560" font-size="19" fill="#9eb8a9" text-anchor="middle" font-weight="400">Batches</text><text x="40" y="563" font-size="18" fill="#9eb8a9" text-anchor="start" font-weight="600">OFF-POLICY LEARNING</text><text x="40" y="598" font-size="21" fill="#adbbb2" text-anchor="start" font-weight="400">The learner can use data</text><text x="40" y="629" font-size="21" fill="#adbbb2" text-anchor="start" font-weight="400">from an older policy.</text><text x="40" y="699" font-size="19" fill="#adbbb2" text-anchor="start" font-weight="400">Conceptual flow: a transition contains the observation, action, reward, next observation and episode status.</text></g></svg>
